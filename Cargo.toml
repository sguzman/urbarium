[package]
name = "urbarium"
default-run = "urbarium"
version = "0.1.0"
edition = "2021"
description = "Real-world geographic data to compact, explorable procedural cities"
license = "MIT"
repository = "https://github.com/sguzman/urbarium"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.5"

[profile.release]
lto = "thin"
strip = true

[features]
default = []
viewer = ["dep:wgpu", "dep:winit", "dep:glam", "dep:bytemuck",
          "dep:pollster", "dep:gloo-net", "dep:wasm-bindgen-futures",
          "dep:web-sys", "dep:console_error_panic_hook", "dep:web-time"]

[dependencies.wgpu]
version = "30.0.0"
optional = true

[dependencies.winit]
version = "0.30.13"
optional = true

[dependencies.web-time]
version = "1.1"
optional = true

[dependencies.glam]
version = "0.30"
optional = true

[dependencies.bytemuck]
version = "1.23"
features = ["derive"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-net = { version = "0.6", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[[bin]]
name = "urbarium"
path = "src/main.rs"

[[bin]]
name = "urbarium-viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]
