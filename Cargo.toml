[package]
name = "urbarium"
version = "0.1.0"
edition = "2021"
description = "Real-world geographic data to compact, explorable procedural cities"
license = "MIT"
repository = "https://github.com/sguzman/urbarium"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.5"

[profile.release]
lto = "thin"
strip = true
