name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate download script syntax
        run: bash -n scripts/fetch-downtown-la.sh scripts/build-downtown-overture.sh scripts/fetch-overture-downtown.sh
      - name: Unit tests
        run: cargo test --all-targets
      - name: CLI help
        run: cargo run -- --help
      - name: Synthetic ingestion smoke test (no network)
        run: |
          cargo run -- ingest \
            --region regions/downtown-la.json \
            --osm tests/fixtures/synthetic-overpass.json \
            --out /tmp/urbarium-smoke.json
          python3 - <<'PY'
          import json
          with open('/tmp/urbarium-smoke.json', encoding='utf-8') as handle:
              city = json.load(handle)
          assert city['schema_version'] == 1
          assert len(city['streets']) == 1
          assert len(city['buildings']) == 1
          assert abs(city['buildings'][0]['height_m'] - 10) < 0.001
          assert city['provenance'][0]['license'] == 'ODbL-1.0'
          print('Smoke test: validated 1 street and 1 building')
          PY
      - name: GeoJSON replacement smoke test (no network)
        run: |
          cargo run -- ingest \
            --region regions/downtown-la.json \
            --osm tests/fixtures/synthetic-overpass.json \
            --buildings-geojson tests/fixtures/synthetic-buildings.geojson \
            --height-unit feet \
            --source-name "Synthetic fixture" \
            --source-url "https://example.invalid/test-data" \
            --source-license "synthetic test data" \
            --out /tmp/urbarium-geojson-smoke.json
          python3 - <<'PY'
          import json
          with open('/tmp/urbarium-geojson-smoke.json', encoding='utf-8') as handle:
              city = json.load(handle)
          assert len(city['streets']) == 1
          assert len(city['buildings']) == 1
          building = city['buildings'][0]
          assert building['source_id'] == 'geojson:synthetic-b1'
          assert abs(building['height_m'] - 30.48) < 0.001
          assert len(building['polygons'][0]['rings']) == 2
          assert building['levels'] == 4
          assert len(city['provenance']) == 2
          print('GeoJSON replacement test: validated footprint, hole, feet and provenance')
          PY
      - name: Overture-only GeoJSON ingestion smoke test (no network)
        run: |
          cargo run -- ingest \
            --region regions/downtown-la.json \
            --streets-geojson tests/fixtures/synthetic-streets.geojson \
            --buildings-geojson tests/fixtures/synthetic-buildings.geojson \
            --height-unit feet \
            --source-name "Synthetic Overture-style fixtures" \
            --source-url "https://example.invalid/" \
            --source-license "synthetic test data" \
            --out /tmp/urbarium-overture-only-smoke.json
          python3 - <<'PY'
          import json
          with open('/tmp/urbarium-overture-only-smoke.json', encoding='utf-8') as handle:
              city = json.load(handle)
          assert len(city["streets"]) == 1
          assert len(city["buildings"]) == 1
          assert city["streets"][0]["source_id"] == "geojson:segment:seg-11:0"
          assert city["streets"][0]["name"] == "Fixture Road"
          assert city["provenance"][0]["name"] == "Synthetic Overture-style fixtures"
          assert len(city["provenance"]) == 1
          print('Overture-only ingest test passed')
          PY
      - name: Generate procedural 3D OBJ from synthetic city
        run: |
          cargo run -- mesh \
            --city /tmp/urbarium-overture-only-smoke.json \
            --out /tmp/urbarium-smoke.obj
          python3 - <<'PY'
          p = '/tmp/urbarium-smoke.obj'
          with open(p, encoding='utf-8') as fh:
              lines = list(fh)
          assert sum(x.startswith('v ') for x in lines) >= 3
          assert sum(x.startswith('vn ') for x in lines) >= 3
          assert sum(x.startswith('f ') for x in lines) >= 1
          print('Procedural OBJ geometry smoke test passed')
          PY
      - name: Generate classified synthetic road/path meshes
        run: |
          cargo run -- mesh-roads \
            --city /tmp/urbarium-overture-only-smoke.json \
            --out /tmp/urbarium-transport.obj
          python3 - <<'PY'
          from pathlib import Path
          obj=Path('/tmp/urbarium-transport.obj').read_text()
          mtl=Path('/tmp/urbarium-transport.mtl').read_text()
          assert 'g road_asphalt' in obj
          assert sum(line.startswith('f ') for line in obj.splitlines()) >= 2
          assert 'newmtl road_asphalt' in mtl
          print('Classified road surface mesh smoke test passed')
          PY
      - name: Generate self-contained glTF 2.0 scene
        run: |
          cargo run -- glb \
            --city /tmp/urbarium-overture-only-smoke.json \
            --out /tmp/urbarium-smoke.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct, json
          raw=Path("/tmp/urbarium-smoke.glb").read_bytes()
          magic,version,total=struct.unpack_from("<III",raw)
          assert magic==0x46546C67 and version==2 and total==len(raw)
          size,kind=struct.unpack_from("<II",raw,12)
          assert kind==0x4e4f534a
          doc=json.loads(raw[20:20+size])
          assert doc["asset"]["version"]=="2.0"
          assert len(doc["meshes"]) >= 3, "Ground, buildings and transportation"
          offset=20+size
          length,kind=struct.unpack_from("<II",raw,offset)
          assert kind==0x004e4942
          assert offset+8+length==len(raw)
          print("GLB binary structure validated")
          PY
      - name: Check native WebGPU viewer
        run: cargo check --features viewer --bin urbarium-viewer
      - name: Install WASM compilation target
        run: rustup target add wasm32-unknown-unknown
      - name: Check WebGPU browser viewer
        run: cargo check --target wasm32-unknown-unknown --features viewer --bin urbarium-viewer
