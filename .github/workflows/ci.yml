name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate download script syntax
        run: bash -n scripts/fetch-downtown-la.sh scripts/build-downtown-overture.sh scripts/fetch-overture-downtown.sh
      - name: Unit tests
        run: cargo test --all-targets
      - name: CLI help
        run: cargo run -- --help
      - name: Synthetic ingestion smoke test (no network)
        run: |
          cargo run -- ingest \
            --region regions/downtown-la.json \
            --osm tests/fixtures/synthetic-overpass.json \
            --out /tmp/urbarium-smoke.json
          python3 - <<'PY'
          import json
          with open('/tmp/urbarium-smoke.json', encoding='utf-8') as handle:
              city = json.load(handle)
          assert city['schema_version'] == 1
          assert len(city['streets']) == 1
          assert len(city['buildings']) == 1
          assert abs(city['buildings'][0]['height_m'] - 10) < 0.001
          assert city['provenance'][0]['license'] == 'ODbL-1.0'
          print('Smoke test: validated 1 street and 1 building')
          PY
      - name: GeoJSON replacement smoke test (no network)
        run: |
          cargo run -- ingest \
            --region regions/downtown-la.json \
            --osm tests/fixtures/synthetic-overpass.json \
            --buildings-geojson tests/fixtures/synthetic-buildings.geojson \
            --height-unit feet \
            --source-name "Synthetic fixture" \
            --source-url "https://example.invalid/test-data" \
            --source-license "synthetic test data" \
            --out /tmp/urbarium-geojson-smoke.json
          python3 - <<'PY'
          import json
          with open('/tmp/urbarium-geojson-smoke.json', encoding='utf-8') as handle:
              city = json.load(handle)
          assert len(city['streets']) == 1
          assert len(city['buildings']) == 1
          building = city['buildings'][0]
          assert building['source_id'] == 'geojson:synthetic-b1'
          assert abs(building['height_m'] - 30.48) < 0.001
          assert len(building['polygons'][0]['rings']) == 2
          assert building['levels'] == 4
          assert len(city['provenance']) == 2
          print('GeoJSON replacement test: validated footprint, hole, feet and provenance')
          PY
      - name: Overture-only GeoJSON ingestion smoke test (no network)
        run: |
          cargo run -- ingest \
            --region regions/downtown-la.json \
            --streets-geojson tests/fixtures/synthetic-streets.geojson \
            --buildings-geojson tests/fixtures/synthetic-buildings.geojson \
            --height-unit feet \
            --source-name "Synthetic Overture-style fixtures" \
            --source-url "https://example.invalid/" \
            --source-license "synthetic test data" \
            --out /tmp/urbarium-overture-only-smoke.json
          python3 - <<'PY'
          import json
          with open('/tmp/urbarium-overture-only-smoke.json', encoding='utf-8') as handle:
              city = json.load(handle)
          assert len(city["streets"]) == 1
          assert len(city["buildings"]) == 1
          assert city["streets"][0]["source_id"] == "geojson:segment:seg-11:0"
          assert city["streets"][0]["name"] == "Fixture Road"
          assert city["provenance"][0]["name"] == "Synthetic Overture-style fixtures"
          assert len(city["provenance"]) == 1
          print('Overture-only ingest test passed')
          PY
