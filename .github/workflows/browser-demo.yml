name: Build and test browser demo

# Build a complete, self-contained city browser package, with an acquired
# geographic sample. No massive datasets are checked into the git repository.
on:
  push:
    paths:
      - .github/workflows/browser-demo.yml
      - src/bin/viewer.rs
      - src/bin/viewer.wgsl
      - web/minimap.js
      - web/gpu-test.html
      - scripts/edge-vulkan-probe.sh
      - scripts/edge-vulkan-render.sh
      - web/data-cache.js
      - web/wasm-sw.js
      - web/quicklook.js
      - scripts/stamp-geography.py
      - web/landmarks.json
      - web/stats.js
      - src/lib.rs
      - src/geometry.rs
      - src/roads.rs
      - src/road_grade.rs
      - src/road_coverage.rs
      - src/road_building_conflicts.rs
      - src/road_clearance.rs
      - src/collision.rs
      - src/terrain.rs
      - src/terrain_drape.rs
      - src/surface_clip.rs
      - src/pedestrian_clip.rs
      - src/streaming.rs
      - src/far_lod.rs
      - src/chunk_mesh.rs
      - scripts/fetch-terrain.py
      - src/gltf.rs
      - src/main.rs
      - regions/downtown-la.json
      - regions/little-tokyo-east.json
      - regions/catalog.json
      - scripts/build-region-overture.sh
      - scripts/validate-region-catalog.py
      - scripts/build-downtown-overture.sh
      - Cargo.toml
      - index.html
      - scripts/qa-browser.py
      - scripts/qa-quicklook.py
      - scripts/qa-mesh-benchmark.py
      - scripts/publish_road_conflicts.py
      - scripts/test_publish_road_conflicts.py
  workflow_dispatch:

# Cancel superseded builds on the SAME branch. Feature-branch QA must
# never cancel or hold up a verified main-branch GitHub Pages deployment.
concurrency:
  group: urbarium-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire actual Downtown LA street and building data
        run: |
          python -m pip install overturemaps Pillow
          bash scripts/build-downtown-overture.sh
          python3 scripts/fetch-terrain.py --region regions/downtown-la.json --out data/processed/downtown-la-terrain.json
          mkdir -p web/assets
          cp data/processed/downtown-la.json web/assets/downtown-la.json
          cp data/processed/downtown-la-terrain.json web/assets/downtown-la-terrain.json
          python3 scripts/validate-region-catalog.py
          bash scripts/build-region-overture.sh regions/little-tokyo-east.json little-tokyo-east
          python3 scripts/fetch-terrain.py --region regions/little-tokyo-east.json --out data/processed/little-tokyo-east-terrain.json
          cp data/processed/little-tokyo-east.json web/assets/little-tokyo-east.json
          cp data/processed/little-tokyo-east-terrain.json web/assets/little-tokyo-east-terrain.json
      - name: Build source-backed 3D conflict review locations
        run: |
          python3 -m unittest discover -s scripts -p 'test_publish_road_conflicts.py'
          python3 scripts/publish_road_conflicts.py \
            --city data/processed/downtown-la.json \
            --city data/processed/little-tokyo-east.json \
            --out web/assets/road-conflict-locations.json
      - name: Install pinned Trunk WebAssembly bundler
        run: |
          curl -fLS --retry 2 \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/trunk.tar.gz
          tar -xzf /tmp/trunk.tar.gz -C /usr/local/bin trunk
          trunk --version
      - name: Stamp per-asset immutable cache fingerprints
        run: python3 scripts/stamp-geography.py
      - name: Validate isolated Edge Vulkan diagnostic launcher
        run: |
          bash -n scripts/edge-vulkan-probe.sh
          grep -q -- '--user-data-dir=\"\$profile\"' scripts/edge-vulkan-probe.sh
          grep -q -- '--enable-features=Vulkan' scripts/edge-vulkan-probe.sh
          grep -q -- '--render-node-override=/dev/dri/renderD128' scripts/edge-vulkan-probe.sh
          bash -n scripts/edge-vulkan-render.sh
          grep -q -- '--ozone-platform=wayland' scripts/edge-vulkan-render.sh
          grep -q -- '--user-data-dir=\"\$profile\"' scripts/edge-vulkan-render.sh
          grep -q -- '--render-node-override=/dev/dri/renderD128' scripts/edge-vulkan-render.sh
      - name: Compile real Rust/WebGPU WASM app
        run: trunk build --release --public-url ./
      - name: Build CPU-only Rust WASM mesh worker
        run: |
          cargo build --release --target wasm32-unknown-unknown --features viewer --bin urbarium-mesh-worker
          BINDGEN="$(find "$HOME/.cache" -type f -name wasm-bindgen -perm /u+x | head -n 1)"
          test -n "$BINDGEN"
          "$BINDGEN" --target no-modules --out-name urbarium-mesh-worker --out-dir dist \
            target/wasm32-unknown-unknown/release/urbarium-mesh-worker.wasm
          test -s dist/urbarium-mesh-worker.js
          test -s dist/urbarium-mesh-worker_bg.wasm
          echo "CPU worker bytes: $(stat -c%s dist/urbarium-mesh-worker_bg.wasm)"
      - name: Stamp worker executable content hash for independent disk caching
        run: python3 scripts/stamp-worker-wasm.py dist
      - name: Remove eager WASM preload so first fetch can be cached
        run: python3 scripts/remove-wasm-preload.py dist/index.html
      - name: Validate static site and scene data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          dist=Path("dist")
          assert (dist/"index.html").is_file()
          assert (dist/"assets"/"downtown-la.json").is_file()
          assert (dist/"assets"/"little-tokyo-east.json").is_file()
          conflict_review=json.loads((dist/"assets"/"road-conflict-locations.json").read_text())
          assert conflict_review["schema_version"]==1
          assert len(conflict_review["regions"])==2
          assert sum(r["centerline_conflicts"] for r in conflict_review["regions"])==len(conflict_review["cases"])
          assert all(c["centerline_inside_m"]>0.05 for c in conflict_review["cases"])
          assert all(len(c["focus_lonlat"])==2 for c in conflict_review["cases"])
          east=json.loads((dist/"assets"/"little-tokyo-east.json").read_text())
          assert east["region"]["id"]=="little-tokyo-east"
          assert len(east["streets"]) > 100 and len(east["buildings"]) > 50, (len(east["streets"]),len(east["buildings"]))
          east_terrain=json.loads((dist/"assets"/"little-tokyo-east-terrain.json").read_text())
          assert east_terrain["region_id"]=="little-tokyo-east"
          assert east_terrain["width"]*east_terrain["height"]==len(east_terrain["heights_m"])
          city=json.loads((dist/"assets"/"downtown-la.json").read_text())
          assert len(city["streets"]) > 500
          assert len(city["buildings"]) > 300
          terrain=json.loads((dist/"assets"/"downtown-la-terrain.json").read_text())
          assert terrain["region_id"] == city["region"]["id"]
          assert terrain["width"]*terrain["height"] == len(terrain["heights_m"])
          assert max(terrain["heights_m"])-min(terrain["heights_m"]) > 2
          wasm=list(dist.glob("*.wasm"))
          js=list(dist.glob("*.js"))
          assert wasm and js,(wasm,js)
          assert (dist/"minimap.js").is_file(), "Minimap JavaScript missing from published site"
          assert (dist/"gpu-test.html").is_file(), "GPU diagnostic page must be shipped"
          assert (dist/"data-cache.js").is_file(), "Persistent geography cache script missing"
          assert (dist/"quicklook.js").is_file(), "Pre-WASM geographic renderer missing"
          assert (dist/"wasm-sw.js").is_file(), "WASM service worker missing"
          assert (dist/"urbarium-mesh-worker.js").is_file()
          assert (dist/"urbarium-mesh-worker_bg.wasm").is_file()
          assert (dist/"mesh-worker-runtime.js").is_file()
          import hashlib
          worker_wasm=(dist/"urbarium-mesh-worker_bg.wasm").read_bytes()
          worker_runtime=(dist/"mesh-worker-runtime.js").read_text()
          assert hashlib.sha256(worker_wasm).hexdigest() in worker_runtime
          assert "__URBARIUM_WORKER_SHA256__" not in worker_runtime
          worker=(dist/"wasm-sw.js").read_text()
          assert "urbarium-wasm-binaries-v1" in worker and "MAX_VERSIONS=2" in worker
          assert "wasm-sw.js" in (dist/"index.html").read_text()
          assert "urbarium-geography-downtown-la-v1" in (dist/"data-cache.js").read_text()
          import hashlib,re
          page=(dist/"index.html").read_text()
          assert not re.search(r'<link\b(?=[^>]*\brel="preload")(?=[^>]*\btype="application/wasm")',page), "Eager WASM preload bypasses first-visit caching"
          hashes=re.search(r'window\.__urbariumGeographyVersions\s*=\s*(\{[^;]+\});',page)
          assert hashes,"Missing geography content-version stamp in bundled HTML"
          versions=json.loads(hashes.group(1))
          for filename in ("downtown-la.json","downtown-la-terrain.json",
                           "little-tokyo-east.json","little-tokyo-east-terrain.json"):
              digest=hashlib.sha256((dist/"assets"/filename).read_bytes()).hexdigest()
              assert versions.get(filename)==digest,("Geography manifest mismatch",filename)
          print("Published cache versions:",{k:v[:12] for k,v in versions.items()})
          landmarks=json.loads((dist/"assets"/"landmarks.json").read_text())
          assert landmarks["region_id"] == city["region"]["id"]
          assert len(landmarks["landmarks"]) == 9
          kinds={m["id"]:m["kind"] for m in landmarks["landmarks"]}
          assert kinds["stanley-mosk"] == "legal"
          assert sum(kind == "legal" for kind in kinds.values()) == 1
          assert kinds["city-hall"] == "civic"
          assert kinds["central-library"] == "library"
          assert kinds["grand-park"] == "park"
          assert all(-118.258 <= m["coordinates"][0] <= -118.242 and
                     34.045 <= m["coordinates"][1] <= 34.056
                     for m in landmarks["landmarks"])
          assert (dist/"stats.js").is_file(), "Stats JavaScript missing from published site"
          page=(dist/"index.html").read_text()
          assert 'quicklook.js' in page
          assert 'startup-preview' in page
          assert 'minimap-canvas' in page
          assert 'map-zoom-in' in page
          assert 'landmark-legend' in page and 'landmarks-show-all' in page
          assert 'landmarks-hide-all' in page and 'time-of-day' in page
          assert 'id="layer-landmarks"' not in page
          assert 'refresh-geography' in page
          assert 'id="region-select"' in page
          assert len(json.loads(page.split('window.__urbariumRegionCatalog = ',1)[1].split(';',1)[0])["regions"])==2
          print("Browser package:",len(city["streets"]),"streets;",
                len(city["buildings"]),"buildings;",
                wasm[0].stat().st_size,"WASM bytes")
          PY
      - name: Install headless Chromium QA
        run: |
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Install software Vulkan presentation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Validate geometry ownership and elevation seams in every packaged region
        run: python3 scripts/qa-world-regions.py dist/assets
      - name: Validate final road ownership for every catalog region
        run: |
          python3 -c 'import json; [print(r["id"]) for r in json.load(open("regions/catalog.json"))["regions"]]' |
          while IFS= read -r rid; do
            echo "Checking regional asphalt and pedestrian seams: $rid"
            cargo run --quiet -- verify-road-cells --city "dist/assets/$rid.json"
          done
      - name: Diagnose asphalt/building footprint interference in every region
        run: |
          python3 -c 'import json; [print(r["id"]) for r in json.load(open("regions/catalog.json"))["regions"]]' |
          while IFS= read -r rid; do
            cargo run --quiet -- audit-road-buildings --city "dist/assets/$rid.json"
          done
      - name: QA viewer draws source geography before WASM can initialize
        run: |
          python3 -m http.server 8010 --directory dist >/tmp/urbarium-http.log 2>&1 &
          xvfb-run --auto-servernum -s '-screen 0 1280x800x24' python3 scripts/qa-quicklook.py
      - name: QA viewer in browser with WebGPU
        run: |
          xvfb-run --auto-servernum -s '-screen 0 1280x800x24' python3 scripts/qa-browser.py
      - name: QA WebGL2 fallback without browser WebGPU
        env:
          URBARIUM_QA_FORCE_WEBGL: "1"
        run: |
          xvfb-run --auto-servernum -s '-screen 0 1280x800x24' python3 scripts/qa-browser.py
      - name: Warm-cache main-thread versus worker mesh performance and pixel parity
        run: |
          xvfb-run --auto-servernum -s '-screen 0 1280x800x24' python3 scripts/qa-mesh-benchmark.py
      - name: Retain mesh performance comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: urbarium-mesh-benchmark
          path: /tmp/urbarium-mesh-benchmark.json
          retention-days: 14
      - name: Retain parity screenshots on a failed visual comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urbarium-worker-parity-debug
          path: /tmp/urbarium-benchmark-*.png
          if-no-files-found: ignore
          retention-days: 5
      - name: Stage GitHub Pages site artifact after successful Chromium QA
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Retain actual WebGPU render screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: urbarium-browser-render
          path: /tmp/urbarium-browser-debug*.png
          retention-days: 14
      - name: Package playable browser site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: urbarium-browser-downtown-la
          path: dist/
          retention-days: 14
      - name: Retain failed site bundle for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urbarium-browser-failed-site
          path: dist/
          retention-days: 2
      - name: Upload browser debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urbarium-browser-debug
          path: /tmp/urbarium-browser-debug*.png
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified city site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public HTML entrypoint and LA data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking published Urbarium: $PAGE_URL"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 --location --silent --show-error \
            "${PAGE_URL%/}/" -o /tmp/urbarium-live.html
          grep -q 'URBARIUM' /tmp/urbarium-live.html
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error \
            "${PAGE_URL%/}/minimap.js" -o /tmp/urbarium-minimap-live.js
          grep -q 'data-map-ready' /tmp/urbarium-minimap-live.js
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error \
            "${PAGE_URL%/}/gpu-test.html" -o /tmp/urbarium-gpu-test-live.html
          grep -q "Run adapter test and download JSON" /tmp/urbarium-gpu-test-live.html
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error \
            "${PAGE_URL%/}/assets/landmarks.json" -o /tmp/urbarium-landmarks-live.json
          python3 -c "import json; assert len(json.load(open('/tmp/urbarium-landmarks-live.json'))['landmarks']) == 9"
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error "${PAGE_URL%/}/data-cache.js" -o /tmp/urbarium-cache-live.js
          grep -q 'urbarium-geography-downtown-la-v1' /tmp/urbarium-cache-live.js
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error \
            "${PAGE_URL%/}/wasm-sw.js" -o /tmp/urbarium-wasm-sw-live.js
          grep -q 'urbarium-wasm-binaries-v1' /tmp/urbarium-wasm-sw-live.js
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error "${PAGE_URL%/}/stats.js" -o /tmp/urbarium-stats-live.js
          grep -q 'gpu-mesh-bytes' /tmp/urbarium-stats-live.js
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error \
            "${PAGE_URL%/}/assets/little-tokyo-east.json" -o /tmp/urbarium-east-live.json
          python3 -c "import json; c=json.load(open('/tmp/urbarium-east-live.json')); assert len(c['buildings'])>50 and c['region']['id']=='little-tokyo-east'"
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error \
            "${PAGE_URL%/}/assets/downtown-la.json" -o /tmp/urbarium-live.json
          curl --fail --retry 5 --retry-delay 3 --location --silent --show-error "${PAGE_URL%/}/assets/downtown-la-terrain.json" -o /tmp/urbarium-terrain-live.json
          python3 - <<'PY'
          import json
          city=json.load(open('/tmp/urbarium-live.json',encoding='utf-8'))
          assert len(city['buildings']) > 300
          assert len(city['streets']) > 500
          terrain=json.load(open('/tmp/urbarium-terrain-live.json',encoding='utf-8'))
          assert len(terrain['heights_m']) == 4225
          print('Published LA scene:',len(city['buildings']),'buildings;',
                len(city['streets']),'streets')
          PY
