name: Downtown LA Overture live-data verification

# One time on addition; manually dispatchable for future data refresh.
on:
  push:
    paths:
      - .github/workflows/real-overture-snapshot.yml
  workflow_dispatch:

jobs:
  verify-live-overture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Overture CLI
        run: python -m pip install overturemaps
      - name: Download Downtown LA transportation and buildings
        run: bash scripts/build-downtown-overture.sh
      - name: Build low-poly 3D building massing mesh
        run: |
          cargo run --release -- mesh \
            --city data/processed/downtown-la.json \
            --out data/processed/downtown-la-buildings.obj
      - name: Build classified transportation meshes
        run: |
          cargo run --release -- mesh-roads \
            --city data/processed/downtown-la.json \
            --out data/processed/downtown-la-transport.obj
      - name: Export combined lightweight glTF scene
        run: |
          cargo run --release -- glb \
            --city data/processed/downtown-la.json \
            --out data/processed/downtown-la.glb
      - name: Verify real data volume
        run: |
          python3 - <<'PY'
          import json
          city = json.load(open('data/processed/downtown-la.json', encoding='utf-8'))
          assert len(city['streets']) > 10, 'No substantial transportation dataset'
          assert len(city['buildings']) > 10, 'No substantial building dataset'
          # Source bbox predicate returns intersecting features whose geometry
          # extends far outside the tile; importer must clip every street span.
          import math
          region = city['region']
          lon0, lat0 = region['origin']
          w, s, e, n = region['bbox']
          radius = 6371008.8
          factor = radius * math.pi / 180
          xmin, xmax = [(v-lon0)*factor*math.cos(math.radians(lat0)) for v in (w, e)]
          zmin, zmax = [(v-lat0)*factor for v in (s, n)]
          for street in city['streets']:
              assert street['path'], street['source_id']
              for point in street['path']:
                  assert xmin-0.001 <= point['x'] <= xmax+0.001, street['source_id']
                  assert zmin-0.001 <= point['z'] <= zmax+0.001, street['source_id']
          print('REAL_STREET_BOUNDS_VERIFIED= true')
          print('REAL_DOWNTOWN_LA_STREETS=', len(city['streets']))
          print('REAL_DOWNTOWN_LA_BUILDINGS=', len(city['buildings']))
          PY
      - name: Retain bounded geographic sample
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downtown-la-overture-city-slice
          path: |
            data/processed/downtown-la.json
            data/processed/downtown-la-buildings.obj
            data/processed/downtown-la-transport.obj
            data/processed/downtown-la.glb
            data/processed/urbarium-transport.mtl
            data/processed/downtown-la-overture-report.json
          retention-days: 7
